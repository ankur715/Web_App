<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Sales Analytics Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-alt: #1d2130;
    --border: #2a2f3f;
    --text: #e7e9ee;
    --text-dim: #9aa0b0;
    --accent: #5b8def;
    --accent-dim: #2a3a5c;
    --user-bubble: #2b3550;
    --bot-bubble: #1d2130;
    --error: #e5544c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .sub {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 13px;
  }
  #status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  #status.ok { color: #6fd08c; border-color: #2f5b3f; }
  #status.err { color: var(--error); border-color: #5c2a2a; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot .bubble.error { border-color: #5c2a2a; color: #f3a8a4; }

  details.sql {
    max-width: 100%;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  details.sql summary {
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
  }
  details.sql pre {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 6px 0 0 0;
    color: #c7d0e0;
  }

  .table-wrap {
    max-width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { background: var(--panel-alt); color: var(--text-dim); font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  .row-count { font-size: 12px; color: var(--text-dim); }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  form#composer .inner {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  input#question {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  input#question:focus { border-color: var(--accent); }
  button#send {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button#send:disabled { opacity: .5; cursor: not-allowed; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 12px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .chip {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text-dim);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>🛍️ Retail Sales Analytics <span class="sub">SAKS Fifth Avenue &middot; sales chatbot</span></h1>
  <span id="status">checking backend&hellip;</span>
</header>

<div class="suggestions" id="suggestions">
  <span class="chip">How much did we sell of Nike shoes last month?</span>
  <span class="chip">Which store had the highest total sales this year?</span>
  <span class="chip">Who are our top 5 customers by lifetime value?</span>
  <span class="chip">What products are low on inventory?</span>
</div>

<main id="messages"></main>

<form id="composer">
  <div class="inner">
    <input id="question" type="text" placeholder="Ask about sales, inventory, customers…" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
  // Opened as a local file (desktop convenience): talk to the backend on localhost.
  // Served BY the backend itself (e.g. a phone hitting http://<mac-ip>:8000/):
  // use relative paths so it works from any device on the network, same-origin.
  const API_BASE = window.location.protocol.startsWith("http") ? "" : "http://localhost:8000";
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const suggestionsEl = document.getElementById("suggestions");

  function addMessage(role, contentBuilder) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    contentBuilder(wrap);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function addUserMessage(text) {
    addMessage("user", (wrap) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
    });
  }

  function addTypingIndicator() {
    return addMessage("bot", (wrap) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble typing";
      bubble.innerHTML = "<span></span><span></span><span></span>";
      wrap.appendChild(bubble);
    });
  }

  function renderTable(rows) {
    if (!rows || rows.length === 0) return null;
    const cols = Object.keys(rows[0]);
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    cols.forEach((c) => {
      const th = document.createElement("th");
      th.textContent = c;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.slice(0, 50).forEach((row) => {
      const tr = document.createElement("tr");
      cols.forEach((c) => {
        const td = document.createElement("td");
        td.textContent = row[c];
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function addBotResponse(data) {
    addMessage("bot", (wrap) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = data.summary || "No response.";
      wrap.appendChild(bubble);

      if (data.sql_query) {
        const details = document.createElement("details");
        details.className = "sql";
        const summary = document.createElement("summary");
        summary.textContent = "View generated SQL";
        const pre = document.createElement("pre");
        pre.textContent = data.sql_query;
        details.appendChild(summary);
        details.appendChild(pre);
        wrap.appendChild(details);
      }

      const rows = data.query_result && data.query_result.rows;
      if (rows && rows.length) {
        const table = renderTable(rows);
        if (table) wrap.appendChild(table);
        const count = document.createElement("div");
        count.className = "row-count";
        count.textContent = `${data.query_result.row_count} row(s) returned`;
        wrap.appendChild(count);
      }
    });
  }

  function addErrorResponse(message) {
    addMessage("bot", (wrap) => {
      const bubble = document.createElement("div");
      bubble.className = "bubble error";
      bubble.textContent = message;
      wrap.appendChild(bubble);
    });
  }

  // Harmless when not behind ngrok; bypasses ngrok's browser-warning
  // interstitial when this page is loaded through an ngrok tunnel.
  const NGROK_SKIP_HEADER = { "ngrok-skip-browser-warning": "true" };

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`, { headers: NGROK_SKIP_HEADER });
      const data = await res.json();
      if (data.llm_configured) {
        statusEl.textContent = `● connected (${data.model})`;
        statusEl.className = "ok";
      } else {
        statusEl.textContent = "● backend up, no API key configured";
        statusEl.className = "err";
      }
    } catch (e) {
      statusEl.textContent = "● backend unreachable";
      statusEl.className = "err";
    }
  }

  async function sendQuestion(text) {
    if (!text.trim()) return;
    addUserMessage(text);
    input.value = "";
    sendBtn.disabled = true;
    suggestionsEl.style.display = "none";

    const typingWrap = addTypingIndicator();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...NGROK_SKIP_HEADER },
        body: JSON.stringify({ message: text }),
      });
      typingWrap.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addErrorResponse(err.detail || `Request failed (${res.status})`);
        return;
      }

      const data = await res.json();
      addBotResponse(data);
    } catch (e) {
      typingWrap.remove();
      addErrorResponse(`Couldn't reach the backend at ${API_BASE}. Is app.py running?`);
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendQuestion(input.value);
  });

  suggestionsEl.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) {
      sendQuestion(e.target.textContent);
    }
  });

  checkHealth();
</script>

</body>
</html>
